name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - ritik

jobs:
  frontend-ci:
    name: Frontend Build & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build

  backend-ci:
    name: Backend & Prisma Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate server entry point syntax
        run: node --check server/server.js

      - name: Validate server modular files syntax
        run: |
          node --check server/config/env.js
          node --check server/config/db.js
          node --check server/middleware/auth.js
          node --check server/controllers/adminController.js
          node --check server/controllers/prController.js
          node --check server/controllers/collegeHeadController.js
          node --check server/controllers/coordinatorController.js
          node --check server/controllers/registrationController.js
          node --check server/routes/adminRoutes.js
          node --check server/routes/prRoutes.js
          node --check server/routes/collegeHeadRoutes.js
          node --check server/routes/coordinatorRoutes.js
          node --check server/routes/publicRoutes.js

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Audit npm dependencies for critical vulnerabilities
        run: npm audit --audit-level=critical
